# Environment lock for Project Classroom -- Product Zero (PRD 16, Phase 0).
#
# Captured from the machine this pipeline was measured on. Two caveats a reader
# needs before treating it as an RTX 3090 environment:
#
#   * torch here is the **CPU** build. Every measurement in this repository's
#     reports was taken on CPU, and the run manifest records the device and the
#     reason for every configuration so a CPU figure is never compared against a
#     GPU one. On a 3090, replace the torch line with the CUDA build matching
#     the installed driver; nothing else in this file changes.
#   * `rfdetr` is absent. `rf_detr_native` and `rf_detr_sahi` are therefore
#     recorded as `resource_unavailable` in every run, and are never substituted
#     by D-FINE (PRD 5).
