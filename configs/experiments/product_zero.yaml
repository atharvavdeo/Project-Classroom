# The full Product Zero comparison. Sequential residency is the current
# execution mode for a 24 GB card; the 32 GB target that would allow
# concurrent residency, multi-camera and batch processing is future scope
# (doubt.md 0.1).
experiment_id: product_zero
description: Full A/B comparison across pose, object and tracker families.
seed: 20260818
artifact_root: artifacts/runs
residency: sequential
vram_safety_margin_gb: 2.0
configs:
  - person_detection_primary
  - tracker_primary
  - seat_only_no_track
  - rtmpose_baseline
  - rtmo_baseline
  - rtmo_large
  - alphapose_crowd_baseline
  - dfine_native
  - rf_detr_native
  - dfine_sahi
  - rf_detr_sahi
  - gemma_marked_evidence
stages:
  - source
  - 01_ingest
  - 02_health
  - 03_alignment
  - 04_calibration
  - 05_motion_roi
  - 06_segmentation
  - 07_tracking
  - 08_pose
  - 09_object
  - 10_evidence
  - 11_gemma
  - 12_evaluation
  - 13_reports
